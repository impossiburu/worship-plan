<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForBuilder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">
                    SDA
                </div>
                <div>
                    <h1>SDAWorshipConstructor</h1>
                    <span>
                        Конструктор плана богослужения
                    </span>
                </div>
            </div>
            <div class="mode-switch">
                <button id="editModeButton" class="btn active">✏️ Редактирование</button>
                <button id="previewModeButton" class="btn">👁 Предпросмотр</button>
            </div>
        </header>
        <main class="workspace">
            <aside class="sidebar">
                <section class="panel">
                    <h2>План</h2>
                    <label>Название 
                        <input id="planTitle" type="text" placeholder="Например: Воскресное богослужение">
                    </label>
                    <label>Дата 
                        <input id="planDate" type="date">
                    </label>
                    <label>Примечание <textarea id="planNote" placeholder="Общее примечание"></textarea></label>
                </section>

                <section class="panel">
                    <h2>Компоненты</h2>
                    <button id="addItemButton" class="btn primary">＋ Новый пункт</button>
                    <button id="addHymnButton" class="btn primary">🎵 Гимн</button>
                </section>

                <section class="panel actions">
                    <button id="exportButton" class="btn">💾 Экспорт JSON</button>
                    <button id="importButton" class="btn">📂 Импорт JSON</button>
                    <input id="importFile" type="file" accept=".json" hidden>
                    <button id="clearButton" class="btn danger">🗑 Очистить</button>
                    <button id="printButton" class="btn">🖨 Печать</button>
                    <section class="panel">
                        <h2>Печать</h2>
                        <label class="checkbox">
                            <input id="compactPrint" type="checkbox">Компактный режим
                        </label>
                        <label>
                            Размер текста
                            <input id="printFontSize" type="number" min="12" max="24" value="17">
                        </label>
                        <label class="checkbox">
                            <input id="hideEmptyPrint" type="checkbox" checked>
                            Скрывать пустые поля
                        </label>
                </section>
                </section>
            </aside>

            <section class="content">
                <div id="editor" class="editor">

                </div>
                <div id="preview" class="preview hidden">

                </div>
            </section>
        </main>
    </div>

    <template id="itemTemplate">
        <article class="component-card item-card">
            <div class="card-header">
                <span class="drag-handle">☰</span>
                <strong>Новый пункт</strong>
                <button class="delete-button">Х</button>
            </div>
            <input class="item-text" type="text" placeholder="Текст пункта">
            <textarea class="item-note" placeholder="Примечание или ответственный"></textarea>
            <label class="checkbox">
                <input class="item-bold" type="checkbox">Жирный текст
            </label>
        </article>
    </template>

    <template id="hymnTemplate">
        <article class="component-card hymn-card">
            <div class="card-header">
                <span class="drag-handle">☰</span>
                <strong>Гимн</strong>
                <button class="delete-button">Х</button>
            </div>
            <input class="hymn-input" list="hymnList" id="hymn-list" placeholder="Введите номер или название">
        </article>
    </template>

    <datalist id="hymnList"></datalist>

    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/components.js"></script>
    <script src="js/render.js"></script>
    <script src="js/print.js"></script>
    <script src="js/network.js"></script>
    <script src="js/file.js"></script>
    <script src="js/hymns.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
